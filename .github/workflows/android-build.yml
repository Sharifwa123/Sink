name: Android build

# This is the first place Sink's Android module tree actually gets compiled.
# The sandbox this project was developed in has no Android SDK and no
# network access to Google's Maven repository (dl.google.com), so only the
# pure-Kotlin engine/ build could be verified there — see
# docs/ANDROID_LIMITATIONS.md and docs/IMPLEMENTATION_STATUS.md. GitHub's
# runners have both, so this workflow is the real compile/test gate.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; the two publish-* jobs below elevate to
# contents: write only for themselves, since they're the only ones that
# create/update GitHub Releases.
permissions:
  contents: read

jobs:
  engine-tests:
    name: Engine unit tests (pure Kotlin/JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run engine test suite
        working-directory: engine
        run: ./gradlew test --stacktrace

      - name: Upload engine test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: engine/*/build/reports/tests/test/
          if-no-files-found: ignore

  build-debug-apk:
    name: Build debug APK
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No explicit Android SDK setup action: GitHub's ubuntu-latest runner
      # image already ships a preinstalled, pre-licensed Android SDK
      # (cmdline-tools, platform-tools, common platforms/build-tools) with
      # ANDROID_HOME already set. android-actions/setup-android@v3 was tried
      # here first and failed — it tries to install the long-removed legacy
      # "tools" package against Google's current SDK repository — so it was
      # dropped rather than worked around. AGP downloads compileSdk 34 /
      # matching build-tools itself if they aren't already on the image.

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sink-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release-apk:
    name: Build signed release APK (only if signing secrets are configured)
    needs: engine-tests
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Sharifwa123/Sink' && vars.HAS_RELEASE_SIGNING == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # keystore.properties is intentionally .gitignored (see docs/RELEASE.md) —
      # reconstructed here from repository secrets, never committed.
      - name: Reconstruct release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sink-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/sink-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sink-release-apk
          path: app/build/outputs/apk/release/*.apk

  # Now that the repository is public, a workflow-run artifact isn't a real
  # download link for a visitor: it expires (default 90 days) and requires
  # being signed into GitHub just to fetch it. A GitHub Release has neither
  # limitation, so it's the actual permanent, public download surface.
  #
  # This job maintains a single rolling "latest-debug" release that always
  # points at the newest successful build on the default branch — a
  # continuous-build pattern, not a versioned release (debug builds don't
  # carry a meaningful version bump on every commit).
  publish-debug-release:
    name: Publish permanent debug APK release
    needs: build-debug-apk
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sink-debug-apk
          path: dist

      - name: Publish/replace the "latest-debug" GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path=$(find dist -name '*.apk' | head -n1)
          gh release delete latest-debug --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest-debug "$apk_path" \
            --repo "${{ github.repository }}" \
            --title "Latest debug build" \
            --notes "Automatically published from commit ${{ github.sha }} on every push to ${{ github.event.repository.default_branch }}. This is a debug-signed build for trying Sink without building it yourself — it is not a production release. See docs/RELEASE.md and docs/IMPLEMENTATION_STATUS.md." \
            --prerelease

  # Only runs once RELEASE_KEYSTORE_BASE64/RELEASE_KEYSTORE_PASSWORD/
  # RELEASE_KEY_ALIAS/RELEASE_KEY_PASSWORD secrets and the HAS_RELEASE_SIGNING
  # variable are configured (see docs/RELEASE.md) — until then this is a no-op,
  # and visitors get the debug release above instead.
  publish-release:
    name: Publish signed release APK to a permanent GitHub Release
    needs: build-release-apk
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Sharifwa123/Sink' && vars.HAS_RELEASE_SIGNING == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sink-release-apk
          path: dist

      - name: Read versionName from app/build.gradle.kts
        id: version
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path=$(find dist -name '*.apk' | head -n1)
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" "$apk_path" \
            --repo "${{ github.repository }}" \
            --title "Sink $tag" \
            --notes "Signed release build of Sink. See docs/RELEASE.md and docs/IMPLEMENTATION_STATUS.md for what is and isn't implemented." \
            --latest \
            || gh release upload "$tag" "$apk_path" --repo "${{ github.repository }}" --clobber
